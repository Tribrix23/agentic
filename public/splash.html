<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Quantix - Preparing Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --text-primary: #f4f4f5;
      --text-secondary: #71717a;
      --text-muted: #52525b;
      --accent: #818cf8;
      --accent-light: #a5b4fc;
      --success: #34d399;
      --purple: #c084fc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Main Card ── */
    .workspace-loader {
      position: relative;
      width: 380px;
      border-radius: 24px;
      overflow: hidden;
      animation: cardEntry 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
      transform: translateY(20px) scale(0.97);
    }

    @keyframes cardEntry {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Gradient border glow */
    .card-glow {
      position: absolute; inset: -1px; border-radius: 25px; padding: 1px;
      background: linear-gradient(160deg,
        rgba(129,140,248,0.4) 0%, rgba(192,132,252,0.15) 30%,
        rgba(255,255,255,0.05) 50%, rgba(52,211,153,0.1) 70%,
        rgba(129,140,248,0.25) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 20;
    }

    /* Rotating shimmer border */
    .card-shimmer {
      position: absolute; inset: -1px; border-radius: 25px; padding: 1px;
      background: conic-gradient(from var(--shimmer-angle,0deg),
        transparent 0%, rgba(129,140,248,0.5) 10%, transparent 20%, transparent 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; z-index: 21;
      animation: shimmerRotate 4s linear infinite; opacity: 0.6;
    }

    @property --shimmer-angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }
    @keyframes shimmerRotate { to { --shimmer-angle: 360deg; } }

    /* Card interior */
    .card-body {
      position: relative;
      background: linear-gradient(165deg,
        rgba(30,27,55,0.95) 0%, rgba(15,14,28,0.98) 50%, rgba(10,10,20,0.99) 100%);
      backdrop-filter: blur(60px) saturate(1.5);
      -webkit-backdrop-filter: blur(60px) saturate(1.5);
      padding: 36px 36px 28px;
      display: flex; flex-direction: column; gap: 28px; z-index: 10;
    }

    .card-body::before {
      content: '';
      position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* ── Header ── */
    .header { display: flex; align-items: center; gap: 16px; }

    .logo-mark {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center; position: relative; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #c084fc 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1) inset,
        0 4px 20px rgba(99,102,241,0.4),
        0 0 40px rgba(139,92,246,0.2);
    }

    .logo-mark::after {
      content: '';
      position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
    }

    .logo-mark svg {
      width: 22px; height: 22px; fill: white;
      position: relative; z-index: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }

    .brand-text h1 {
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px; line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .brand-text span {
      font-size: 12px; color: var(--text-secondary); font-weight: 400;
      margin-top: 5px; display: block; letter-spacing: 0.2px;
    }

    .divider {
      height: 1px; margin: -8px 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    /* ── Task List ── */
    .task-list { display: flex; flex-direction: column; gap: 6px; }

    .task-item {
      display: flex; align-items: center; gap: 14px;
      font-size: 12.5px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      padding: 8px 12px; border-radius: 10px; position: relative;
      transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
      opacity: 0.35; border: 1px solid transparent;
    }

    .task-item.active {
      opacity: 1; color: var(--text-primary);
      background: rgba(99,102,241,0.06);
      border-color: rgba(99,102,241,0.12);
    }

    .task-item.done {
      opacity: 0.75; color: var(--success);
      background: transparent; border-color: transparent;
    }

    .task-icon {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid currentColor;
      display: grid; place-items: center; flex-shrink: 0;
      transition: all 0.4s ease; position: relative;
    }

    .task-item.active .task-icon {
      border-color: var(--accent);
      background: rgba(99,102,241,0.15);
      box-shadow: 0 0 12px rgba(99,102,241,0.3);
    }

    .task-item.active .task-icon::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-light);
      animation: pulseDot 1.2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.4; transform:scale(0.7); }
    }

    .task-item.done .task-icon {
      background: var(--success); border-color: var(--success);
      box-shadow: 0 0 10px rgba(52,211,153,0.3);
    }

    .task-item.done .task-icon::after {
      content: '';
      width: 7px; height: 4px;
      border-left: 1.5px solid #052e1c; border-bottom: 1.5px solid #052e1c;
      transform: rotate(-45deg) translateY(-1px);
    }

    .task-progress {
      position: absolute; bottom: 0; left: 12px; right: 12px;
      height: 1px; background: rgba(99,102,241,0.1);
      border-radius: 1px; overflow: hidden; opacity: 0; transition: opacity 0.3s;
    }

    .task-item.active .task-progress { opacity: 1; }

    .task-progress-bar {
      height: 100%; border-radius: 1px; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      animation: progressFill 1.2s ease-in-out forwards;
    }

    @keyframes progressFill { to { width: 100%; } }

    /* ── Footer ─ */
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
    }

    .status-area { display: flex; align-items: center; gap: 8px; }

    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: statusPulse 1.5s ease-in-out infinite; transition: background 0.4s;
    }

    .status-dot.ready {
      background: var(--success); animation: none;
      box-shadow: 0 0 8px rgba(52,211,153,0.5);
    }

    @keyframes statusPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #status-msg {
      font-size: 11.5px; color: var(--text-secondary);
      font-weight: 500; letter-spacing: 0.1px; transition: color 0.4s;
    }

    .kbd-group { display: flex; align-items: center; gap: 4px; }

    .kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 5px;
      background: rgba(255,255,255,0.05); border-radius: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
      color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 1px 3px rgba(0,0,0,0.3);
    }

    .kbd-sep {
      font-size: 9px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Overall Progress Bar ── */
    .overall-progress {
      height: 2px; background: rgba(255,255,255,0.04);
      position: relative; overflow: hidden;
    }

    .overall-progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #c084fc, #34d399);
      background-size: 200% 100%; border-radius: 0 2px 2px 0;
      transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
      animation: gradientShift 2s linear infinite;
      box-shadow: 0 0 10px rgba(99,102,241,0.5);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
  </style>
</head>

<body>

  <div class="workspace-loader">
    <div class="card-glow"></div>
    <div class="card-shimmer"></div>

    <div class="card-body">
      <div class="header">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            <path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c1.66 0 3.14-.69 4.22-1.78L14.83 14.83A2.98 2.98 0 0 1 12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4c0 .74-.2 1.43-.55 2.02l1.42 1.42A5.96 5.96 0 0 0 18 12c0-3.31-2.69-6-6-6z"/>
            <circle cx="17" cy="17" r="1.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Quantix</h1>
          <span>Agentic Workspace</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="task-list" id="task-list">
        <div class="task-item active" data-step="0">
          <div class="task-icon"></div>
          <span class="task-label">Verifying environment</span>
          <div class="task-progress"><div class="task-progress-bar"></div></div>
        </div>
        <div class="task-item pending" data-step="1">
          <div class="task-icon"></div>
          <span class="task-label">Loading agent memory</span>
          <div class="task-progress"><div class="task-progress-bar"></div></div>
        </div>
        <div class="task-item pending" data-step="2">
          <div class="task-icon"></div>
          <span class="task-label">Indexing project graph</span>
          <div class="task-progress"><div class="task-progress-bar"></div></div>
        </div>
        <div class="task-item pending" data-step="3">
          <div class="task-icon"></div>
          <span class="task-label">Establishing LLM link</span>
          <div class="task-progress"><div class="task-progress-bar"></div></div>
        </div>
      </div>

      <div class="footer">
        <div class="status-area">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-msg">Initializing…</span>
        </div>
        <div class="kbd-group">
          <div class="kbd">⌘</div>
          <span class="kbd-sep">+</span>
          <div class="kbd">K</div>
        </div>
      </div>
    </div>

    <div class="overall-progress">
      <div class="overall-progress-bar" id="overall-bar"></div>
    </div>
  </div>

  <script>
    const tasks = document.querySelectorAll('.task-item');
    const statusMsg = document.getElementById('status-msg');
    const statusDot = document.getElementById('status-dot');
    const overallBar = document.getElementById('overall-bar');
    let currentStep = 0;
    const totalSteps = tasks.length;

    function updateOverall() {
      overallBar.style.width = (currentStep / totalSteps * 100) + '%';
    }

    function advanceStep() {
      if (currentStep >= totalSteps) return;
      tasks[currentStep].classList.remove('active');
      tasks[currentStep].classList.add('done');
      currentStep++;
      updateOverall();
      if (currentStep < totalSteps) {
        tasks[currentStep].classList.remove('pending');
        tasks[currentStep].classList.add('active');
        const bar = tasks[currentStep].querySelector('.task-progress-bar');
        bar.style.animation = 'none'; bar.offsetHeight; bar.style.animation = '';
        statusMsg.textContent = tasks[currentStep].querySelector('.task-label').textContent + '…';
        setTimeout(advanceStep, 700 + Math.random() * 1100);
      } else {
        statusMsg.textContent = 'Ready';
        statusMsg.style.color = 'var(--success)';
        statusDot.classList.add('ready');
        overallBar.style.width = '100%';
      }
    }

    updateOverall();
    setTimeout(advanceStep, 900);
  </script>
</body>
</html>
