<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quantix Agentic Coder - Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.5);
      --secondary: #3b82f6;
      --bg: #09090b;
      --card: rgba(24, 24, 27, 0.7);
      --border: rgba(255, 255, 255, 0.1);
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      position: relative;
      width: 340px;
      height: 400px;
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Ambient background glow inside the card */
    .glow {
      position: absolute;
      width: 150px;
      height: 150px;
      background: var(--primary);
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.4;
      animation: floatGlow 6s ease-in-out infinite alternate;
      z-index: 0;
    }

    .glow:nth-child(2) {
      background: var(--secondary);
      width: 120px;
      height: 120px;
      animation: floatGlow2 7s ease-in-out infinite alternate;
      right: -20px;
      bottom: -20px;
    }

    @keyframes floatGlow {
      0% { transform: translate(-30px, -30px); opacity: 0.3; }
      100% { transform: translate(30px, 30px); opacity: 0.6; }
    }

    @keyframes floatGlow2 {
      0% { transform: translate(30px, 30px); opacity: 0.2; }
      100% { transform: translate(-30px, -30px); opacity: 0.5; }
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-bottom-color: var(--secondary);
      animation: spin 3s linear infinite;
      opacity: 0.8;
    }

    .logo-ring-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      animation: spin-reverse 4s linear infinite;
    }

    .logo-core {
      width: 40%;
      height: 40%;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 0 20px var(--primary-glow);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      transform: rotate(45deg);
    }

    .brand-title {
      color: white;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      background: linear-gradient(to right, #fff, #c4b5fd, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .brand-subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 4px;
      margin: 0 0 30px 0;
      text-transform: uppercase;
    }

    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: load 1.5s ease-in-out infinite, gradientMove 2s linear infinite;
    }

    .status-text {
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
      letter-spacing: 1px;
      animation: fade 1.5s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: rotate(45deg) scale(1); box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
      50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 30px rgba(139, 92, 246, 0.8); }
    }

    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    @keyframes load {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    @keyframes gradientMove {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    @keyframes fade {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="glow"></div>
    <div class="glow"></div>
    
    <div class="content">
      <div class="logo-container">
        <div class="logo-ring"></div>
        <div class="logo-ring-inner"></div>
        <div class="logo-core"></div>
      </div>
      
      <h1 class="brand-title">Quantix</h1>
      <h2 class="brand-subtitle">Agentic IDE</h2>
      
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      
      <div class="status-text">INITIALIZING SUBSYSTEMS...</div>
    </div>
  </div>
  
  <script>
    // Simulate updating status text for a dynamic feel
    const statuses = [
      "INITIALIZING SUBSYSTEMS...",
      "LOADING AI MODELS...",
      "ESTABLISHING SECURE CONNECTION...",
      "PREPARING WORKSPACE...",
      "BOOTING QUANTIX CORE..."
    ];
    let currentIndex = 0;
    const statusEl = document.querySelector('.status-text');
    
    setInterval(() => {
      currentIndex = (currentIndex + 1) % statuses.length;
      statusEl.style.opacity = 0;
      setTimeout(() => {
        statusEl.textContent = statuses[currentIndex];
        statusEl.style.opacity = 1;
      }, 300);
    }, 2500);
  </script>
</body>
</html>
